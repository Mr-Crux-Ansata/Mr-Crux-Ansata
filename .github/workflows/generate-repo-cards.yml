name: Generate Repository Cards

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: repository-card
  cancel-in-progress: true

jobs:
  generate-card:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generate CVE repository card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Mr-Crux-Ansata&repo=cve-vulnerability-classifier&title_color=FF4F9A&text_color=FFF0F6&icon_color=FF9FC2&bg_color=211923&border_color=FF4F9A&hide_border=false&border_radius=6&show_owner=true&description_lines_count=3
          path: assets/cve-vulnerability-classifier.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/cve-vulnerability-classifier.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update repository card"

          git push origin main
