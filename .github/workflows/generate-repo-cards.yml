name: Generate Repository Cards

on:
  workflow_dispatch:

jobs:
  generate-card:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate CVE repository card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Mr-Crux-Ansata&repo=cve-vulnerability-classifier&show_owner=true&description_lines_count=3
          path: assets/cve-vulnerability-classifier.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/cve-vulnerability-classifier.svg

          git diff --cached --quiet && exit 0

          git commit -m "Update repository card"

          git push origin HEAD:main
