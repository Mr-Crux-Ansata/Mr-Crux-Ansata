name: Generate Repository Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate CVE Vulnerability Classifier card
        run: |
          mkdir -p assets

          curl -L \
            "https://github-readme-stats.vercel.app/api/pin/?username=Mr-Crux-Ansata&repo=cve-vulnerability-classifier&theme=tokyonight&hide_border=true" \
            -o assets/cve-vulnerability-classifier.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          git diff --cached --quiet || git commit -m "Update repository cards"

          git push
